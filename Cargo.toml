[workspace]
members = [
    "crates/httppilot-ai",
    "crates/httppilot-core",
    "crates/httppilot-storage",
    "crates/httppilot-desktop",
    "crates/httppilot-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
iced = { version = "0.14", features = ["tokio"] }
reqwest = "0.13"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
directories = "6"
